[project]
name = "tareas"
version = "1.0.0"
description = "CLI que ordena, renombra, copia y limpia ficheros con acciones definidas en acciones.json"
readme = "README.md"
authors = [
    { name = "Jose Ruiz" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "platformdirs>=4.13.6",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
tareas = "tareas.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
